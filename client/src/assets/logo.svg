<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#534ab7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g transform="translate(10, 10)">
    <!-- Icon -->
    <rect width="40" height="40" rx="10" fill="url(#logo-grad)" />
    <!-- Outer overlapping circle/globe for sync -->
    <circle cx="20" cy="20" r="11" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9" />
    <!-- Dynamic horizontal connection line inside -->
    <path d="M14 20 L26 20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <!-- Dynamic diagonal node connection to show sync -->
    <path d="M18 15 L22 25" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <!-- Interactive dots -->
    <circle cx="18" cy="15" r="2.5" fill="#ffffff" />
    <circle cx="22" cy="25" r="2.5" fill="#ffffff" />
    
    <!-- Text -->
    <text x="55" y="27" font-family="'Inter', 'Outfit', sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="-0.5">CodeSync</text>
    <circle cx="158" cy="18" r="3.5" fill="#1d9e75" filter="url(#glow)" />
  </g>
</svg>
