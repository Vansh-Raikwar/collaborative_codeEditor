<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
    
    <!-- Neon Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    
    <linearGradient id="secondary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neon-glow-primary" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="neon-glow-secondary" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Illustration Background Box -->
  <rect x="10" y="10" width="480" height="380" rx="20" fill="url(#bg-glow)" stroke="#2d2e3b" stroke-width="1.5" />

  <!-- Code Editor Window Mockup -->
  <g transform="translate(60, 60)">
    <!-- Window Frame -->
    <rect width="380" height="260" rx="12" fill="#0f1115" stroke="#21222c" stroke-width="2" />
    
    <!-- Window Header -->
    <path d="M 0,12 A 12,12 0 0 1 12,0 L 368,0 A 12,12 0 0 1 380,12 L 380,36 L 0,36 Z" fill="#171820" />
    
    <!-- Window Controls (Three Dots) -->
    <circle cx="20" cy="18" r="5" fill="#f87171" />
    <circle cx="36" cy="18" r="5" fill="#fbbf24" />
    <circle cx="52" cy="18" r="5" fill="#34d399" />
    
    <!-- Tab -->
    <path d="M 80,36 L 90,14 A 4,4 0 0 1 94,11 L 180,11 A 4,4 0 0 1 184,14 L 194,36 Z" fill="#0f1115" />
    <text x="108" y="27" font-family="monospace" font-size="11" fill="#f3f4f6">App.jsx</text>
    
    <!-- Grid/Visual Editor Background -->
    <rect x="20" y="56" width="340" height="180" rx="8" fill="#14161d" />

    <!-- Code Line Mockups (Syntactic colors) -->
    <!-- Line 1: import ... -->
    <rect x="40" y="75" width="120" height="8" rx="4" fill="#a78bfa" opacity="0.8" />
    <rect x="170" y="75" width="80" height="8" rx="4" fill="#6366f1" opacity="0.6" />
    
    <!-- Line 2: function App() { -->
    <rect x="40" y="95" width="50" height="8" rx="4" fill="#f87171" opacity="0.9" />
    <rect x="100" y="95" width="60" height="8" rx="4" fill="#60a5fa" opacity="0.8" />
    
    <!-- Line 3: Indented return ( -->
    <rect x="60" y="115" width="45" height="8" rx="4" fill="#e879f9" opacity="0.8" />
    
    <!-- Line 4: Double Indented div -->
    <rect x="80" y="135" width="200" height="8" rx="4" fill="url(#primary-grad)" />
    
    <!-- Line 5: Double Indented component -->
    <rect x="80" y="155" width="160" height="8" rx="4" fill="url(#secondary-grad)" />

    <!-- Line 6: Closing tags -->
    <rect x="60" y="175" width="50" height="8" rx="4" fill="#e879f9" opacity="0.8" />
    <rect x="40" y="195" width="20" height="8" rx="4" fill="#f87171" opacity="0.9" />

    <!-- Collaborators Active Cursors -->
    <!-- Jess K's Cursor -->
    <g transform="translate(245, 131)">
      <!-- Line Cursor -->
      <line x1="0" y1="0" x2="0" y2="16" stroke="#a78bfa" stroke-width="2" filter="url(#neon-glow-primary)" />
      <!-- Cursor Label -->
      <rect x="2" y="-14" width="48" height="15" rx="3" fill="#a78bfa" />
      <text x="6" y="-3" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#0f1115">Jess K.</text>
    </g>

    <!-- Sam R's Cursor -->
    <g transform="translate(180, 151)">
      <!-- Line Cursor -->
      <line x1="0" y1="0" x2="0" y2="16" stroke="#34d399" stroke-width="2" filter="url(#neon-glow-secondary)" />
      <!-- Cursor Label -->
      <rect x="2" y="12" width="48" height="15" rx="3" fill="#34d399" />
      <text x="6" y="23" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#0f1115">Sam R.</text>
    </g>
  </g>

  <!-- Glowing background design items (Floating circles & waves showing cloud sync) -->
  <circle cx="60" cy="80" r="25" fill="#8b5cf6" opacity="0.15" filter="url(#neon-glow-primary)" />
  <circle cx="430" cy="300" r="30" fill="#34d399" opacity="0.15" filter="url(#neon-glow-primary)" />

  <!-- Cloud Sync / Connection Waves -->
  <path d="M 40,240 Q 80,210 120,240 T 200,240" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,4" opacity="0.4" />
  <path d="M 320,100 Q 360,70 400,100 T 480,100" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6,4" opacity="0.4" />

  <!-- Collaborative Connected Nodes overlay -->
  <g transform="translate(20, 310)" opacity="0.8">
    <circle cx="20" cy="20" r="6" fill="#a78bfa" />
    <circle cx="50" cy="10" r="4" fill="#34d399" />
    <circle cx="60" cy="40" r="5" fill="#f87171" />
    <line x1="20" y1="20" x2="50" y2="10" stroke="#4b5563" stroke-width="1.5" />
    <line x1="20" y1="20" x2="60" y2="40" stroke="#4b5563" stroke-width="1.5" />
  </g>
</svg>
